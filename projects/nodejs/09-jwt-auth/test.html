<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT认证系统测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-button {
      flex: 1;
      padding: 10px;
      border: none;
      background: #f0f0f0;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s;
    }

    .tab-button.active {
      background: #667eea;
      color: white;
    }

    .tab-button:hover {
      background: #e0e0e0;
    }

    .tab-button.active:hover {
      background: #5568d3;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5568d3;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .token-display {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 12px;
      word-break: break-all;
      display: none;
    }

    .token-display.show {
      display: block;
    }

    .token-display .label {
      font-weight: bold;
      color: #555;
      margin-bottom: 5px;
    }

    .user-info {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
    }

    .user-info.show {
      display: block;
    }

    .user-info h3 {
      color: #0066cc;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .user-info p {
      color: #555;
      font-size: 14px;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 JWT认证系统</h1>
    <p class="subtitle">测试JWT的完整流程</p>

    <div class="tab-buttons">
      <button class="tab-button active" onclick="switchTab('register')">注册</button>
      <button class="tab-button" onclick="switchTab('login')">登录</button>
      <button class="tab-button" onclick="switchTab('profile')">个人信息</button>
    </div>

    <!-- 注册表单 -->
    <form id="register-form" class="form active" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="register-username" placeholder="请输入用户名" required>
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="register-email" placeholder="请输入邮箱地址" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="register-password" placeholder="请输入密码（至少6位）" required minlength="6">
      </div>
      <button type="submit">注册</button>
      <div id="register-message" class="message"></div>
    </form>

    <!-- 登录表单 -->
    <form id="login-form" class="form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="login-username" placeholder="请输入用户名" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码" required>
      </div>
      <button type="submit">登录</button>
      <div id="login-message" class="message"></div>
      <div id="token-display" class="token-display">
        <div class="label">🎫 你的Token（已自动保存）：</div>
        <div id="token-value" style="white-space: pre-wrap;"></div>
      </div>
    </form>

    <!-- 个人信息表单 -->
    <form id="profile-form" class="form" onsubmit="handleGetProfile(event)">
      <p style="color: #666; font-size: 14px; margin-bottom: 15px;">
        点击按钮获取你的个人信息（需要携带token）
      </p>
      <button type="submit">获取个人信息</button>
      <div id="profile-message" class="message"></div>
      <div id="user-info" class="user-info">
        <h3>👤 用户信息</h3>
        <p><strong>ID：</strong><span id="user-id"></span></p>
        <p><strong>用户名：</strong><span id="user-username"></span></p>
        <p><strong>邮箱：</strong><span id="user-email"></span></p>
        <p><strong>注册时间：</strong><span id="user-created"></span></p>
      </div>
    </form>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';

    // 切换标签页
    function switchTab(tab) {
      // 隐藏所有表单
      document.querySelectorAll('.form').forEach(form => form.classList.remove('active'));
      // 移除所有按钮的active类
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));

      // 显示选中的表单
      document.getElementById(`${tab}-form`).classList.add('active');
      // 激活对应按钮
      event.target.classList.add('active');
    }

    // 显示消息
    function showMessage(elementId, message, type) {
      const messageEl = document.getElementById(elementId);
      messageEl.textContent = message;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';

      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }

    // 获取保存的accessToken
    function getAccessToken() {
      return localStorage.getItem('access_token');
    }

    // 获取保存的refreshToken
    function getRefreshToken() {
      return localStorage.getItem('refresh_token');
    }

    // 保存token
    function saveToken(accessToken, refreshToken) {
      localStorage.setItem('access_token', accessToken);
      localStorage.setItem('refresh_token', refreshToken);
    }

    // 清除token
    function clearTokens() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
    }

    // 刷新access token
    async function refreshAccessToken() {
      const refreshToken = getRefreshToken();

      if (!refreshToken) {
        throw new Error('没有Refresh Token');
      }

      const response = await fetch(`${API_URL}/api/auth/refresh-token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken })
      });

      const data = await response.json();

      if (data.success) {
        // 更新access token
        localStorage.setItem('access_token', data.data.accessToken);
        return data.data.accessToken;
      } else {
        // Refresh token也过期了，清除所有token
        clearTokens();
        throw new Error(data.message);
      }
    }

    // 带自动刷新的fetch请求
    async function fetchWithRefresh(url, options = {}) {
      const token = getAccessToken();

      if (token) {
        options.headers = {
          ...options.headers,
          'Authorization': `Bearer ${token}`
        };
      }

      let response = await fetch(url, options);

      // 如果401（token过期），尝试刷新
      if (response.status === 401 && getRefreshToken()) {
        try {
          const newToken = await refreshAccessToken();

          // 用新token重新发送请求
          options.headers = {
            ...options.headers,
            'Authorization': `Bearer ${newToken}`
          };

          response = await fetch(url, options);
        } catch (error) {
          console.error('刷新token失败：', error);
          // 刷新失败，清除token并跳转到登录
          clearTokens();
          alert('登录已过期，请重新登录');
          window.location.reload();
          return response;
        }
      }

      return response;
    }

    // 注册
    async function handleRegister(event) {
      event.preventDefault();

      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;

      try {
        const response = await fetch(`${API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('register-message', '✅ 注册成功！请登录', 'success');
          document.getElementById('register-form').reset();
          // 自动切换到登录标签
          setTimeout(() => {
            switchTab('login');
            document.querySelectorAll('.tab-button')[1].click();
          }, 1500);
        } else {
          showMessage('register-message', `❌ ${data.message}`, 'error');
        }
      } catch (error) {
        showMessage('register-message', `❌ 网络错误：${error.message}`, 'error');
      }
    }

    // 登录
    async function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('login-message', '✅ 登录成功！Token已保存', 'success');

          // 保存两个token ⭐
          saveToken(data.data.accessToken, data.data.refreshToken);

          // 显示token
          document.getElementById('token-value').textContent =
            `Access Token: ${data.data.accessToken}\n\nRefresh Token: ${data.data.refreshToken}`;
          document.getElementById('token-display').classList.add('show');

          document.getElementById('login-form').reset();
        } else {
          showMessage('login-message', `❌ ${data.message}`, 'error');
        }
      } catch (error) {
        showMessage('login-message', `❌ 网络错误：${error.message}`, 'error');
      }
    }

    // 获取个人信息（带自动刷新token）⭐
    async function handleGetProfile(event) {
      event.preventDefault();

      const token = getAccessToken();

      if (!token) {
        showMessage('profile-message', '❌ 请先登录获取token', 'error');
        return;
      }

      try {
        // 使用fetchWithRefresh，自动处理401错误
        const response = await fetchWithRefresh(`${API_URL}/api/auth/profile`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (data.success) {
          showMessage('profile-message', '✅ 获取成功！', 'success');

          // 显示用户信息
          document.getElementById('user-id').textContent = data.data.id;
          document.getElementById('user-username').textContent = data.data.username;
          document.getElementById('user-email').textContent = data.data.email;
          document.getElementById('user-created').textContent = new Date(data.data.created_at).toLocaleString('zh-CN');
          document.getElementById('user-info').classList.add('show');
        } else {
          showMessage('profile-message', `❌ ${data.message}`, 'error');
          document.getElementById('user-info').classList.remove('show');
        }
      } catch (error) {
        showMessage('profile-message', `❌ 网络错误：${error.message}`, 'error');
      }
    }

    // 页面加载时检查是否有token
    window.onload = function() {
      const token = getAccessToken();
      if (token) {
        document.getElementById('token-value').textContent =
          `Access Token: ${token}`;
        document.getElementById('token-display').classList.add('show');
      }
    };
  </script>
</body>
</html>
