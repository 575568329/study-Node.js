<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express 静态资源服务示例</title>
    <!-- 引用CSS文件 -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🎉 Express 静态资源服务演示</h1>
        <p class="subtitle">这个页面的CSS、JS都是通过静态资源加载的</p>

        <div class="info-box">
            <h2>📚 学到的知识</h2>
            <ul>
                <li>✅ express.static() 托管静态文件夹</li>
                <li>✅ URL路径会去掉文件夹名称</li>
                <li>✅ 多个静态文件夹按顺序查找</li>
                <li>✅ 中间件执行顺序很重要</li>
            </ul>
        </div>

        <button id="btn" class="btn">点击我！</button>
        <p id="message"></p>
        </div>

    <!-- 引用JavaScript文件 -->
    <script src="/js/app.js"></script>
</body>
</html>
